

services:
  # ==========================================
  # APPLICATION SERVICES
  # ==========================================

  mongo-express:
    image: mongo-express:latest
    container_name: splitsmart-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # These must match your 'mongodb' service credentials
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=splitsmart2024
      - ME_CONFIG_MONGODB_URL=mongodb://admin:splitsmart2024@mongodb:27017/
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - splitsmart-network
    depends_on:
      - backend

  # Local MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: splitsmart-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=splitsmart2024
      - MONGO_INITDB_DATABASE=splitsmart
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - splitsmart-network

  # Backend API Service
  backend:
    build:
      context: ./backend
    container_name: splitsmart-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Point to the service name 'mongodb' inside the Docker network
      - MONGODB_URI=mongodb://admin:splitsmart2024@mongodb:27017/splitsmart?authSource=admin
    depends_on:
      - mongodb
    networks:
      - splitsmart-network

  # Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: splitsmart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - splitsmart-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # MONITORING SERVICES
  # ==========================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: splitsmart-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - "./monitoring/prometheus:/etc/prometheus:ro"
      - "prometheus_data:/prometheus"
    networks:
      - splitsmart-network
    depends_on:
      - backend

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: splitsmart-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=splitsmart2024
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - splitsmart-network
    depends_on:
      - prometheus

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: splitsmart-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro  
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - splitsmart-network

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: splitsmart-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - splitsmart-network

  # Nginx Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: splitsmart-nginx-exporter
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://frontend:80/stub_status'
    ports:
      - "9113:9113"
    networks:
      - splitsmart-network
    depends_on:
      - frontend

# ==========================================
# NETWORKS
# ==========================================
networks:
  splitsmart-network:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  mongodb_data: # Remove the indented 'volumes:' line above this
    driver: local